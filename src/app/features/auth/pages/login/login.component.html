<div class="login-container">
  <div class="login-box">
    <div class="loginIcon">
    <i class="fas fa-sign-in-alt"></i>
    </div>
    <h4 class="mb-0">Sign in with email</h4>
    <p class="text-center">Trade with discipline. Track every decision. Improve your edge.</p>
    <div class="form-group email_inputDiv">
    <input class="form-control mb-3"  [(ngModel)]="email" placeholder="Email" />
    <input class="form-control mb-2" [(ngModel)]="password" type="password" placeholder="Password" />
    <!-- <a href="">Forgot password?</a> -->
    <button class="btn btn-primary w-100" (click)="login()">Get Started</button>
    </div>
  </div>
</div>
